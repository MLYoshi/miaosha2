server:
  port: 8083

spring:
  application:
    name: miaosha-service

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}

    # OpenFeign：跨服务调用限时（对齐原 RestClient 实现 connect 2s / read 3s）
    openfeign:
      client:
        config:
          order-service:
            connect-timeout: 2000
            read-timeout: 3000
          goods-service:
            connect-timeout: 2000
            read-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        # payload 为纯 JSON {userId, goodsId, requestId}，不给 Step 5 消费侧带类型头
        spring.json.add.type.headers: false

# 预热：经 HTTP 调 goods-service 取 stockCount/endDate（服务名负载均衡）
goods:
  base-url: ${GOODS_BASE_URL:http://goods-service}

# 降级接缝：同步下单指向 order-service（服务名负载均衡）
order:
  sync-base-url: ${ORDER_SYNC_BASE_URL:http://order-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
