server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/miaosha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: seckill
      enable-auto-commit: false                           # 手动 ack
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.order.*
        # producer（miaosha-service）不带类型头，payload 为纯 JSON {userId, goodsId, requestId}，
        # 需指定反序列化目标类型（消费侧副本 SeckillOrderMessage）
        spring.json.value.default.type: com.example.order.message.SeckillOrderMessage
    listener:
      ack-mode: manual                                    # 消费者显式调用 Acknowledgment.acknowledge()

# 商品快照 / 扣库存 / 回补：经 HTTP 调 goods-service 内部接口
goods:
  base-url: ${GOODS_BASE_URL:http://localhost:8082}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.order.domain,com.example.order.vo
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
