server:
  port: 8080

spring:
  application:
    name: seckill

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/miaosha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: 123456
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    producer:
      acks: all                                          # 可靠发送：等待所有副本确认
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true                          # 幂等生产者
    consumer:
      group-id: seckill
      enable-auto-commit: false                           # 手动 ack
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.seckill.*
    listener:
      ack-mode: manual                                    # 消费者显式调用 Acknowledgment.acknowledge()

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.seckill.domain,com.example.seckill.vo
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
