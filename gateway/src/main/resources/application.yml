server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: goods-service
          uri: lb://goods-service
          predicates:
            - Path=/goods/**
        - id: miaosha-service
          uri: lb://miaosha-service
          predicates:
            - Path=/miaosha/**
        - id: miaosha-service-admin
          uri: lb://miaosha-service
          predicates:
            - Path=/admin/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
