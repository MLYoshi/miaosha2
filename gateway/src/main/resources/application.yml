server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
        - id: goods-service
          uri: http://localhost:8082
          predicates:
            - Path=/goods/**
        - id: miaosha-service
          uri: http://localhost:8083
          predicates:
            - Path=/miaosha/**
        - id: miaosha-service-admin
          uri: http://localhost:8083
          predicates:
            - Path=/admin/**
