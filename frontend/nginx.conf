# nginx 配置：前端静态资源 + SPA 路由回退 + /api 反代后端
#
# 后端地址通过构建参数/环境变量注入。Dockerfile 默认指向 host.docker.internal:8080
# （宿主机后端），生产部署时用 --build-arg 或覆盖本文件后重新构建。
#
# 反代规则：/api/xxx → 后端 /xxx（去掉 /api 前缀，与 vite dev proxy 一致）

# 后端上游地址：构建期由 sed 替换占位 BACKEND_HOST/BACKEND_PORT
upstream seckill_backend {
  server BACKEND_HOST:BACKEND_PORT;
}

server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # gzip 压缩：js/css/json/svg 压缩后体积显著下降
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # SPA 客户端路由回退：除静态资源外一律回 index.html，交给 react-router 处理
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源（带 hash 文件名）长缓存：一年，不可变
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html 不缓存：保证发版后立即生效
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # /api 反代到后端（去掉 /api 前缀，与 dev proxy 一致）
  location /api/ {
    proxy_pass         http://seckill_backend/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # 秒杀链路对超时敏感，保持与前端 axios 10s 一致
    proxy_connect_timeout 5s;
    proxy_read_timeout    10s;
    proxy_send_timeout    10s;
  }
}
