# 数据库：建表 + 种子数据见 db/init/01-init.sql（自包含脚本）
# MySQL 首次启动时经 /docker-entrypoint-initdb.d 自动执行（仅当 ./db/mysql_data 为空时执行一次）。
# 修改 01-init.sql 后重新初始化：docker compose down -v 并清空 ./db/mysql_data，再 docker compose up -d。
services:
  # 1. MySQL：用于最终订单落地和数据持久化
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai # 保证种子脚本 NOW() 与 JVM Asia/Shanghai 时区一致，否则时间窗校验误判
    volumes:
      - ./db/mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d # 首次启动自动执行 01-init.sql（建表 + 种子数据）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Redis：用于库存预扣减、分布式锁、热点数据缓存（秒杀核心）
  redis:
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Kafka：用于秒杀请求排队、异步下单削峰（KRaft 单节点，无 ZooKeeper）
  # 双 listener：PLAINTEXT 对外（宿主机 localhost:9092），INTERNAL 对内（容器间 kafka:9094）
  kafka:
    image: apache/kafka:4.3.1
    container_name: seckill-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # 3.1 Kafka topic 初始化：broker 已关闭自动建 topic（KAFKA_AUTO_CREATE_TOPICS_ENABLE=false），
  # 必须显式创建 seckill-order（秒杀异步下单）与 seckill-order-dlt（死信），否则
  # miaosha-service 发送消息失败 → 每次抢购都走同步降级且响应超时，前端表现为「点了没反应」。
  # 一次性任务，执行完即退出（restart: "no"）。
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: seckill-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists \
          --topic seckill-order --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists \
          --topic seckill-order-dlt --partitions 1 --replication-factor 1
        echo 'kafka topics ready'

  # 4. Nacos：服务注册与发现中心（standalone 单机，HTTP 8848 / 客户端 gRPC 9848）
  # v2.4.0 起官方镜像提供 arm64 原生支持；服务端 2.4.0 对 2.3.x 客户端协议向后兼容
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: seckill-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false" # 本地开发免鉴权，与 spring-cloud-alibaba 客户端默认一致
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 5. 前端：Vite 构建产物由 Nginx 托管，/user /goods /miaosha /admin 反代到 gateway 服务
