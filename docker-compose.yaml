# 数据库：schema 与种子数据见 backend/docs/db-design.md（旧 miaosha.sql 业务模型的人工维护版）
# 新克隆项目若 mysql_data 为空，直接执行自包含种子脚本（含建表 + 种子数据 + 时间窗修正）：
#   docker exec -i seckill-mysql mysql -uroot -proot --default-character-set=utf8mb4 < backend/sql/fix-seed-time-window.sql
# 详细说明见 backend/sql/README.md
services:
  # 1. MySQL：用于最终订单落地和数据持久化
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./backend/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Redis：用于库存预扣减、分布式锁、热点数据缓存（秒杀核心）
  redis:
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Kafka：用于秒杀请求排队、异步下单削峰（KRaft 单节点，无 ZooKeeper）
  # 双 listener：PLAINTEXT 对外（宿主机 localhost:9092），INTERNAL 对内（容器间 kafka:9094）
  kafka:
    image: apache/kafka:4.3.1
    container_name: seckill-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # 4. Nacos：服务注册与发现中心（standalone 单机，HTTP 8848 / 客户端 gRPC 9848）
  # v2.4.0 起官方镜像提供 arm64 原生支持；服务端 2.4.0 对 2.3.x 客户端协议向后兼容
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: seckill-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false" # 本地开发免鉴权，与 spring-cloud-alibaba 客户端默认一致
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 5. 后端：Spring Boot 秒杀服务，容器内通过服务名连接中间件
  backend:
    build: ./backend
    container_name: seckill-backend
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai # JVM 默认时区必须与 SQL 种子/准备脚本的 +08:00 时间窗一致，否则 checkInWindow 误判「秒杀未开始」
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_HOST: kafka
      KAFKA_PORT: "9094"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

